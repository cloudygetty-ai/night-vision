name: native

# Compiles the iOS host + watchOS companion on a macOS runner and smoke-tests
# the host app in the iPhone simulator. No signing: simulator builds only.
on:
  push:
    paths: ['native/**', 'src/**', 'index.html', 'vite.config.js', 'package*.json', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'src/**', 'index.html', 'vite.config.js', 'package*.json', '.github/workflows/native.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build web app
        run: npm ci && npm run build

      - name: Generate Xcode project
        working-directory: native
        run: |
          brew install xcodegen
          xcodegen
          xcodebuild -version

      - name: Build watchOS app (simulator)
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild build -project NVSHost.xcodeproj -scheme NVSWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tee build/watch.log | grep -E 'error:|warning:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' build/watch.log

      - name: Build iOS host (simulator, embeds Watch app)
        working-directory: native
        run: |
          set -o pipefail
          xcodebuild build -project NVSHost.xcodeproj -scheme NVSHost \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO | tee build/ios.log | grep -E 'error:|warning:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' build/ios.log

      - name: Simulator smoke test
        working-directory: native
        run: |
          APP=$(find build/dd/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'NVSHost.app' | head -1)
          test -d "$APP/dist" || { echo "dist/ not bundled into $APP"; exit 1; }
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl privacy "$DEV" grant camera ai.cloudygetty.nvs || true
          xcrun simctl launch --console-pty "$DEV" ai.cloudygetty.nvs > build/console.log 2>&1 &
          sleep 25
          xcrun simctl io "$DEV" screenshot build/simulator.png
          cat build/console.log
          grep -q 'NVS_HEALTH' build/console.log || { echo "no health line — page never finished loading"; exit 1; }
          grep 'NVS_HEALTH' build/console.log | grep -q '"root":[1-9]' || { echo "React root empty — bundle failed to run"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build
          path: |
            native/build/*.log
            native/build/simulator.png
          if-no-files-found: ignore
