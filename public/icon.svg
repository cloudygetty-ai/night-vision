<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#0c1a10"/>
      <stop offset="1" stop-color="#020503"/>
    </radialGradient>
    <radialGradient id="lens" cx="42%" cy="38%" r="68%">
      <stop offset="0" stop-color="#d8ffdf"/>
      <stop offset=".18" stop-color="#7dff9a"/>
      <stop offset=".55" stop-color="#1fd35a"/>
      <stop offset=".85" stop-color="#0b6b2c"/>
      <stop offset="1" stop-color="#03260f"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3a31"/>
      <stop offset="1" stop-color="#121a15"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#000" opacity=".22"/>
    </pattern>
    <clipPath id="lL"><circle cx="168" cy="268" r="92"/></clipPath>
    <clipPath id="lR"><circle cx="344" cy="268" r="92"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- goggle housing -->
  <rect x="54" y="158" width="404" height="220" rx="110" fill="url(#body)" stroke="#3d5445" stroke-width="5"/>
  <!-- mount strap -->
  <rect x="226" y="112" width="60" height="44" rx="12" fill="#1a241e" stroke="#3d5445" stroke-width="4"/>

  <!-- lenses with phosphor glow -->
  <g filter="url(#glow)">
    <circle cx="168" cy="268" r="92" fill="url(#lens)"/>
    <circle cx="344" cy="268" r="92" fill="url(#lens)"/>
  </g>
  <rect x="76" y="176" width="184" height="184" fill="url(#scan)" clip-path="url(#lL)"/>
  <rect x="252" y="176" width="184" height="184" fill="url(#scan)" clip-path="url(#lR)"/>

  <!-- bezels -->
  <circle cx="168" cy="268" r="92" fill="none" stroke="#0a120d" stroke-width="12"/>
  <circle cx="344" cy="268" r="92" fill="none" stroke="#0a120d" stroke-width="12"/>
  <circle cx="168" cy="268" r="99" fill="none" stroke="#56705f" stroke-width="3"/>
  <circle cx="344" cy="268" r="99" fill="none" stroke="#56705f" stroke-width="3"/>

  <!-- reticle in right lens -->
  <g stroke="#041a0b" stroke-width="5" stroke-linecap="round" opacity=".85">
    <line x1="344" y1="206" x2="344" y2="246"/>
    <line x1="344" y1="290" x2="344" y2="330"/>
    <line x1="282" y1="268" x2="322" y2="268"/>
    <line x1="366" y1="268" x2="406" y2="268"/>
  </g>
  <circle cx="344" cy="268" r="9" fill="none" stroke="#041a0b" stroke-width="4" opacity=".85"/>

  <!-- specular highlights -->
  <ellipse cx="140" cy="236" rx="26" ry="15" fill="#fff" opacity=".55" transform="rotate(-28 140 236)"/>
  <ellipse cx="316" cy="236" rx="26" ry="15" fill="#fff" opacity=".55" transform="rotate(-28 316 236)"/>
</svg>
